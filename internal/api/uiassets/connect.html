<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css">
<title>Qiyan — Connect</title>
</head>
<body data-page="nav_team">
<header class="top">
  <span class="brand">Qiyan</span>
  <nav id="topnav"></nav>
  <span class="grow"></span>
  <button id="lang-toggle">中文</button>
</header>
<main id="main">
  <h1 data-i18n="connect_title"></h1>
  <p class="lead" data-i18n="connect_lead"></p>

  <p class="muted" id="cc-status"></p>

  <div class="card">
    <div class="field">
      <label data-i18n="connect_project"></label>
      <div class="row">
        <input type="text" id="project" placeholder="D:/work/my-project" style="flex:1">
        <span id="project-pick"></span>
      </div>
    </div>
    <details class="block">
      <summary data-i18n="connect_advanced"></summary>
      <div class="field" style="margin-top:10px">
        <label data-i18n="connect_claude_bin"></label>
        <input type="text" id="claude-bin" placeholder="(default: from PATH)">
      </div>
    </details>
    <div class="row">
      <button id="preview" class="primary" data-i18n="connect_preview"></button>
    </div>
  </div>

  <div id="plan-area"></div>
  <div id="result-area"></div>

  <h2 data-i18n="connect_installed_list"></h2>
  <div id="installed"></div>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="picker.js"></script>
<script src="connect.js"></script>
</body>
</html>
