name: Agent runtime adapter request
description: Request support for another AI runtime, or announce an adapter you are building.
title: "[Adapter] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, tokens, private code or personal data. Use
        synthetic examples only.**

        Today only **Claude Code** is an officially supported runtime. Adapters for
        other runtimes are welcome as community work; this form is the entry point
        for both requests and offers. Read
        [docs/developer-api.md](https://github.com/QiyanAI/ai-agent-action-surface/blob/main/docs/developer-api.md)
        first — it documents the whole contract, including failure behaviour.
  - type: input
    id: runtime
    attributes:
      label: Runtime name and link
      description: Which AI tool or agent host should integrate with Qiyan?
      placeholder: "Example: Roo Code — https://github.com/RooCodeInc/Roo-Code"
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: What you plan to integrate (or want integrated)
      description: Which pre-execution points exist in that runtime (tool-call hooks, permission layers, an API), and how they would call Qiyan's `/v1` API.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role in this
      options:
        - I want to build the adapter myself
        - I want to build it together with others
        - I am requesting it, not building it
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: What the Control Contract is missing for you (optional)
      description: Fields, endpoints or semantics you would need that the current API does not provide.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included credentials, tokens, private code or personal data in this request.
          required: true
