name: Bug report
description: Something in Qiyan does not work as documented or as intended.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, tokens, private code or personal data — into this
        form or anywhere else. Use synthetic examples only.**

        **Is this a security vulnerability?** Do not use this form. Report it privately
        through [SECURITY.md](https://github.com/QiyanAI/ai-agent-action-surface/blob/main/SECURITY.md).
  - type: markdown
    attributes:
      value: Please search the existing issues before filing — it may already be known.
  - type: input
    id: version
    attributes:
      label: Qiyan version
      description: The output of `qiyan version` (or the filename of the candidate you ran).
      placeholder: "qiyan 0.3.0-beta.1 (commit ..., built ...)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      description: OS and version, and whether you ran a downloaded binary or built from source.
      placeholder: "Windows 11 24H2, downloaded candidate binary"
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What did you do, and what did Qiyan do instead of what you expected?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened? A link to the document you expected it to match helps.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem, starting from `qiyan serve` or the console.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (optional)
      description: |
        Console or terminal output. Review it before pasting: remove anything private —
        real paths, project names, tokens, task text.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included credentials, tokens, private code or personal data in this report.
          required: true
