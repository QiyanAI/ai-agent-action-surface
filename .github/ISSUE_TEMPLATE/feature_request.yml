name: Feature request
description: Propose a capability or a change in how Qiyan works.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, tokens, private code or personal data. Use
        synthetic examples only.**

        Qiyan's scope is deliberately narrow — please read
        [docs/scope-and-claims.md](https://github.com/QiyanAI/ai-agent-action-surface/blob/main/docs/scope-and-claims.md)
        first, and note that
        [CONTRIBUTING.md](https://github.com/QiyanAI/ai-agent-action-surface/blob/main/CONTRIBUTING.md)
        states the rule that binds here: a change that expands the product
        surface is declined even if it is well built.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have read docs/scope-and-claims.md and this request fits the project's current direction.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Qiyan makes hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Qiyan do instead? If you know which part of the product is involved (console, Control API, Safety Lab, connector), say so.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Workarounds you tried, or other designs you weighed.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included credentials, tokens, private code or personal data in this request.
          required: true
